<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <title>EC51 Realm Studio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="connect-panel">
    <div class="connect-card">
      <div class="brand">
        <span class="brand-mark">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4.03 3 9 3s9-1.34 9-3V5"/><path d="M3 12c0 1.66 4.03 3 9 3s9-1.34 9-3"/></svg>
        </span>
        <span class="brand-name">EC51 Realm Studio</span>
      </div>
      <p class="connect-hero-text">Mở file .realm để xem và chỉnh sửa dữ liệu ngay trên trình duyệt.</p>
      <form id="open-form">
        <div class="field">
          <label for="file-path">Đường dẫn file .realm</label>
          <input type="text" id="file-path" placeholder="/duong/dan/toi/file.realm" autocomplete="off" />
        </div>
        <div class="field">
          <label for="encryption-key">Encryption key <span class="field-hint">(hex 128 ký tự, để trống nếu không mã hoá)</span></label>
          <input type="text" id="encryption-key" placeholder="a1b2c3..." autocomplete="off" />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Mở file</button>
      </form>
    </div>
  </div>

  <main>
    <aside id="sidebar">
      <div id="sidebar-header">
        <button type="button" id="toggle-sidebar" class="icon-btn" title="Thu gọn/mở rộng danh sách table">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="search-wrap">
          <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="class-search" placeholder="Tìm table theo tên..." autocomplete="off" />
        </div>
      </div>
      <div id="class-list"></div>
    </aside>
    <section id="content">
      <div id="toolbar" hidden>
        <div class="search-wrap toolbar-filter">
          <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="filter-input" placeholder="Bộ lọc (RQL), ví dụ: age > 18" autocomplete="off" />
        </div>
        <button id="apply-filter" type="button" class="btn btn-ghost">Áp dụng</button>
        <button id="clear-filter" type="button" class="btn btn-ghost">Bỏ lọc</button>
        <button id="reload-table" type="button" class="icon-btn" title="Tải lại dữ liệu của bảng này">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        </button>
        <span class="toolbar-spacer"></span>
        <span id="row-count" class="row-count"></span>
        <button id="load-more" type="button" class="btn btn-ghost" hidden>Xem thêm</button>
        <button id="new-record" type="button" class="btn btn-primary">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Thêm mới
        </button>
        <button id="export-data" type="button" class="btn btn-ghost">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Export
        </button>
      </div>
      <div id="loading-bar"></div>
      <div id="table-wrap"></div>
    </section>
  </main>

  <div id="edit-overlay" hidden>
    <form id="edit-form">
      <h2 id="edit-title"></h2>
      <div id="edit-fields"></div>
      <div id="edit-error"></div>
      <div class="edit-actions">
        <button type="button" id="edit-cancel" class="btn btn-ghost">Hủy</button>
        <button type="submit" class="btn btn-primary">Lưu</button>
      </div>
    </form>
  </div>

  <div id="confirm-overlay" hidden>
    <div class="confirm-card">
      <p id="confirm-message"></p>
      <div class="confirm-actions">
        <button type="button" id="confirm-cancel" class="btn btn-ghost">Hủy</button>
        <button type="button" id="confirm-ok" class="btn btn-danger">Xóa</button>
      </div>
    </div>
  </div>

  <div id="export-overlay" hidden>
    <div class="export-card">
      <h2>Export dữ liệu</h2>
      <div class="field">
        <label class="field-title">Phạm vi dữ liệu</label>
        <label class="radio-option">
          <input type="radio" name="export-scope" id="export-scope-current" value="current" />
          Dữ liệu hiện tại (đang áp dụng filter)
        </label>
        <label class="radio-option">
          <input type="radio" name="export-scope" id="export-scope-all" value="all" />
          Toàn bộ dữ liệu
        </label>
      </div>
      <div class="field">
        <label class="field-title">Format</label>
        <label class="radio-option">
          <input type="radio" name="export-format" id="export-format-csv" value="csv" checked />
          CSV
        </label>
        <label class="radio-option">
          <input type="radio" name="export-format" id="export-format-excel" value="excel" />
          Excel
        </label>
        <label class="radio-option">
          <input type="radio" name="export-format" id="export-format-markdown" value="markdown" />
          Markdown
        </label>
      </div>
      <div class="edit-actions">
        <button type="button" id="export-cancel" class="btn btn-ghost">Hủy</button>
        <button type="button" id="export-confirm" class="btn btn-primary">Export</button>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="app.js"></script>
</body>
</html>
